[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-louvain"
version = "0.1.0"
description = "Mojo-accelerated Louvain community detection"
requires-python = ">=3.10"
dependencies = ["networkx", "numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
